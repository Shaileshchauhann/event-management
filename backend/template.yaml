AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Event Ticket Verification & QR Code Validation backend.
  API Gateway -> Lambda -> DynamoDB -> SES.

Parameters:
  SenderEmail:
    Type: String
    Description: SES-verified "from" address used for ticket emails
  AdminRegistrationSecret:
    Type: String
    Default: ''
    Description: Optional secret required for admin registration when not bootstrapped or authenticated
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Allowed origin for CORS
  FrontendBaseUrl:
    Type: String
    Default: 'http://localhost:5174'
    Description: Base URL of the frontend app used in ticket emails (e.g. https://your-frontend-domain.com)
  RazorpayKeyId:
    Type: String
    Default: ''
    Description: Razorpay Public Key ID
  RazorpayKeySecret:
    Type: String
    Default: ''
    Description: Razorpay Secret Key

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        ADMINS_TABLE: !Ref AdminsTable
        EVENTS_TABLE: !Ref EventsTable
        TICKETS_TABLE: !Ref TicketsTable
        VERIFICATION_CODES_TABLE: !Ref VerificationCodesTable
        PAYMENTS_TABLE: !Ref PaymentsTable
        JWT_SECRET_ARN: !Ref JwtSecret
        SENDER_EMAIL: !Ref SenderEmail
        ADMIN_REGISTRATION_SECRET: !Ref AdminRegistrationSecret
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        FRONTEND_BASE_URL: !Ref FrontendBaseUrl
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret

Resources:

  TicketApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,x-admin-secret'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        ApiKeyRequired: false

  AdminsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: adminId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: adminId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: adminId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AdminIndex
          KeySchema:
            - AttributeName: adminId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventIndex
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: ticketId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC secret used to sign/verify ticket JWTs and admin authentication tokens
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  VerificationCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: challengeId
          AttributeType: S
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: challengeId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TicketIdIndex
          KeySchema:
            - AttributeName: ticketId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: adminId
          AttributeType: S
        - AttributeName: paymentId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventIndex
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AdminIndex
          KeySchema:
            - AttributeName: adminId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: PaymentIdIndex
          KeySchema:
            - AttributeName: paymentId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # --- Admin Authentication Functions ---

  AdminRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/adminRegister.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AdminsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /auth/admin/register
            Method: post

  AdminLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/adminLogin.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AdminsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /auth/admin/login
            Method: post

  # --- Admin Event & Ticket Management Functions ---

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/createEvent.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events
            Method: post
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/events
            Method: post

  ListAdminEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/listAdminEvents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/events
            Method: get

  GetAdminEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getAdminEvent.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/events/{eventId}
            Method: get

  ListEventTicketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/listEventTickets.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/events/{eventId}/tickets
            Method: get

  GetEventStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getEventStats.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/events/{eventId}/stats
            Method: get

  # --- Public Attendee Functions ---

  ListPublicEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/listPublicEvents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events
            Method: get
        ApiPublic:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/events
            Method: get

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getEvent.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events/{eventId}
            Method: get
        ApiPublic:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/events/{eventId}
            Method: get

  IssueTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/issueTicket.handler
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events/{eventId}/tickets
            Method: post
        ApiPublic:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/events/{eventId}/tickets
            Method: post

  GetTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getTicket.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}
            Method: get
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/tickets/{ticketId}
            Method: get

  # --- Gate Verification Function ---

  VerifyTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/verifyTicket.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /verify
            Method: post
            Auth:
              ApiKeyRequired: true


  # --- Ticket Management Operations ---

  ResendTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/resendTicket.handler
      Timeout: 15
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - Statement:
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}/resend
            Method: post
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/tickets/{ticketId}/resend
            Method: post

  CancelTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/cancelTicket.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /tickets/{ticketId}/cancel
            Method: post
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/tickets/{ticketId}/cancel
            Method: post

  # --- Attendee OTP Verification Functions (Email Verification Before Booking) ---

  RequestBookingVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/requestBookingVerification.handler
      Timeout: 15
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationCodesTable
        - Statement:
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/tickets/request-verification
            Method: post

  VerifyAndBookTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/verifyAndBookTicket.handler
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationCodesTable
        - Statement:
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/tickets/verify-and-book
            Method: post

  # --- Attendee OTP Verification Functions (Email Verification Before Cancellation) ---

  RequestCancellationCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/requestCancellationCode.handler
      Timeout: 15
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationCodesTable
        - Statement:
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/tickets/{ticketId}/cancel/request-code
            Method: post

  VerifyCancellationCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/verifyCancellationCode.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationCodesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/tickets/{ticketId}/cancel/verify-code
            Method: post

  UpdateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/updateEvent.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events/{eventId}
            Method: put
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/events/{eventId}
            Method: put

  CreatePaymentOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/createPaymentOrder.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationCodesTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/payments/create-order
            Method: post

  VerifyPaymentAndBookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/verifyPaymentAndBook.handler
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /public/payments/verify
            Method: post

  GetAdminAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/getAdminAnalytics.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/analytics
            Method: get

  ListAdminPaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/listAdminPayments.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/payments
            Method: get

  RefundPaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/refundPayment.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /admin/payments/{paymentId}/refund
            Method: post

  # --- Preserved API Key & Usage Plan Resources ---

  AdminApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: TicketApiProdStage
    Properties:
      Name: event-ticketing-admin-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref TicketApi
          StageName: Prod

  GateApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: TicketApiProdStage
    Properties:
      Name: event-ticketing-gate-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref TicketApi
          StageName: Prod

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TicketApiProdStage
    Properties:
      UsagePlanName: event-ticketing-usage-plan
      ApiStages:
        - ApiId: !Ref TicketApi
          Stage: Prod
      Throttle:
        RateLimit: 20
        BurstLimit: 40

  AdminUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref AdminApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

  GateUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref GateApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  ApiUrl:
    Description: Base URL for the ticketing API
    Value: !Sub https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  AdminApiKeyId:
    Description: "Get the actual value: aws apigateway get-api-key --api-key <id> --include-value"
    Value: !Ref AdminApiKey
  GateApiKeyId:
    Description: "Get the actual value: aws apigateway get-api-key --api-key <id> --include-value"
    Value: !Ref GateApiKey
  VerificationCodesTableName:
    Description: DynamoDB table name for OTP verification challenges
    Value: !Ref VerificationCodesTable
